# Use quando o VPS já tem um proxy (Nginx, Traefik, Caddy) nas portas 80/443.
# O painel fica em 127.0.0.1:3010; aponte o proxy existente do domínio para lá.
services:
  bot:
    build: https://github.com/ronnysoares51/bot-achadinhos.git#main
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - PASTA_DADOS=/app/dados
      - PAINEL_PORTA=3000
    volumes:
      - dados:/app/dados
    ports:
      - "127.0.0.1:3010:3000"

volumes:
  dados:
