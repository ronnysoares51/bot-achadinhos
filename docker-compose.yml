# Bot + painel web. O painel fica em 127.0.0.1:3010 e o HTTPS é feito pelo proxy que já
# existe no VPS (Caddy do projeto evolution-api), com o bloco achadinhos.rstvquix.com.
# Em um servidor sem proxy, use docker-compose.com-caddy.yml (HTTPS automático próprio).
services:
  bot:
    build: https://github.com/ronnysoares51/bot-achadinhos.git#main
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - PASTA_DADOS=/app/dados
      - PAINEL_PORTA=3000
    volumes:
      - dados:/app/dados
    ports:
      - "127.0.0.1:3010:3000"

volumes:
  dados:
