# Bot + painel web, isolado: não usa nem altera nenhum outro projeto do VPS.
# Painel em http://achadinhos.rstvquix.com:3010 (porta própria; as portas 80/443 do VPS
# pertencem a outro projeto e não são tocadas).
# Em um servidor com 80/443 livres, use docker-compose.com-caddy.yml (HTTPS automático).
services:
  bot:
    build: https://github.com/ronnysoares51/bot-achadinhos.git#main
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - PASTA_DADOS=/app/dados
      - PAINEL_PORTA=3000
    volumes:
      - dados:/app/dados
    ports:
      - "3010:3000"

volumes:
  dados:
