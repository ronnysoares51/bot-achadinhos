services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - dados:/app/dados
    expose:
      - "3000"

  # HTTPS automático (Let's Encrypt) para o painel web.
  # Se o VPS já tiver outro proxy nas portas 80/443, use docker-compose.sem-caddy.yml (veja docs/DEPLOY_VPS.md).
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMINIO=${DOMINIO:-achadinhos.rstvquix.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_dados:/data
      - caddy_config:/config
    depends_on:
      - bot

volumes:
  dados:
  caddy_dados:
  caddy_config:
